services:
  - type: web
    name: hrms-website
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 4 --bind 0.0.0.0:$PORT run:app
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: FLASK_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hrms-db
          property: connectionString
      - key: PERSISTENT_DATA_DIR
        value: /var/data
    disk:
      name: hrms-uploads
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: hrms-db
    plan: free
    postgresMajorVersion: "15"
