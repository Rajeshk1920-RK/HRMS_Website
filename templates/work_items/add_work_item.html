{% extends "layouts/base.html" %}

{% block title %}Add Work Item - HRMS{% endblock %}

{% block main_class %}p-3 w-full{% endblock %}

{% block content %}
<div class="w-full px-1">
    <div class="mb-8 flex justify-between items-center">
        <h1 class="text-3xl font-bold text-gray-900">Add Work Item</h1>
        <a href="{{ url_for('work_items.view_work_items') }}"
           class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            <i class="fas fa-arrow-left mr-2"></i>Back to List
        </a>
    </div>

    <div class="bg-white shadow rounded-lg">
        <div class="px-4 py-5 sm:p-6">
            <form id="addWorkItemForm" method="POST" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="project_id" class="block text-sm font-medium text-gray-700">Project <span class="text-red-500">*</span></label>
                        <select name="project_id" id="project_id" required
                            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2.5 px-3 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
                            <option value="">Select Project</option>
                            {% for p in projects %}
                            <option value="{{ p[0] }}">{{ p[1] }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label for="employee_id" class="block text-sm font-medium text-gray-700">Assignee <span class="text-red-500">*</span></label>
                        <select name="employee_id" id="employee_id" required
                            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2.5 px-3 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
                            <option value="">Select Assignee</option>
                            {% for e in employees %}
                            <option value="{{ e[0] }}">{{ e[1] }} {{ e[2] }} ({{ e[10] }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="md:col-span-2">
                        <label for="work_title" class="block text-sm font-medium text-gray-700">Work Title <span class="text-red-500">*</span></label>
                        <input type="text" name="work_title" id="work_title" required minlength="5" maxlength="255"
                            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2.5 px-3 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
                            placeholder="Enter work title (minimum 5 characters)">
                    </div>

                    <div>
                        <label for="estimated_hours" class="block text-sm font-medium text-gray-700">Estimated Hours</label>
                        <input type="number" step="0.25" min="0" name="estimated_hours" id="estimated_hours" value="0.00"
                            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2.5 px-3 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                        <div id="description-editor" class="bg-white h-48 border border-gray-300 rounded-md"></div>
                        <input type="hidden" name="description" id="description">
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Technical Description</label>
                        <div id="tech-description-editor" class="bg-white h-48 border border-gray-300 rounded-md"></div>
                        <input type="hidden" name="technical_description" id="technical_description">
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-6 border-t border-gray-200">
                    <a href="{{ url_for('work_items.view_work_items') }}"
                        class="bg-gray-100 py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition duration-200">
                        Cancel
                    </a>
                    <button type="submit"
                        class="bg-green-600 border border-transparent rounded-md shadow-sm py-2 px-4 inline-flex justify-center text-sm font-medium text-white hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition duration-200">
                        <i class="fas fa-save mr-2"></i>
                        Save Work Item
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Quill editors init -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        var toolbarOptions = [
            ['bold', 'italic', 'underline', 'strike'],
            ['blockquote', 'code-block'],
            [{ 'header': 1 }, { 'header': 2 }],
            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
            [{ 'color': [] }, { 'background': [] }],
            ['clean']
        ];

        var descEditor = new Quill('#description-editor', {
            modules: { toolbar: toolbarOptions },
            theme: 'snow'
        });

        var techEditor = new Quill('#tech-description-editor', {
            modules: { toolbar: toolbarOptions },
            theme: 'snow'
        });

        var form = document.getElementById('addWorkItemForm');
        form.addEventListener('submit', function() {
            document.getElementById('description').value = descEditor.root.innerHTML;
            document.getElementById('technical_description').value = techEditor.root.innerHTML;
        });
    });
</script>
{% endblock %}
