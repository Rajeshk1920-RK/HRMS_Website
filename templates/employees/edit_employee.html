{# templates/edit_employee.html #}
{% extends "layouts/base.html" %}

{% block title %}Edit Employee - Project Tracking System{% endblock %}

{% block main_class %}p-3 w-full{% endblock %}

{% block content %}
<div class="w-full px-1">

    <div class="bg-white shadow rounded-lg">
        <div class="mt-2">
            <h1 class="text-3xl font-bold text-gray-900 text-left ml-8 pt-4">Edit Employee</h1>
        </div>

        <div class="px-4 py-5 sm:p-6">
            <!-- built-in browser validation disabled -->
            <form method="POST" class="space-y-6" id="employeeEditForm" novalidate>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <!-- First Name -->
                    <div>
                        <label for="first_name" class="block text-sm font-medium text-gray-700">First Name</label>
                        <input type="text" name="first_name" id="first_name" value="{{ employee[1] }}"
                               class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
                    </div>

                    <!-- Last Name -->
                    <div>
                        <label for="last_name" class="block text-sm font-medium text-gray-700">Last Name</label>
                        <input type="text" name="last_name" id="last_name" value="{{ employee[2] }}"
                               class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
                    </div>

                    <!-- Gender -->
                    <div>
                        <label for="gender" class="block text-sm font-medium text-gray-700">Gender</label>
                        <select name="gender" id="gender"
                                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
                            <option value="Male"   {% if employee[3] == 'Male'   %}selected{% endif %}>Male</option>
                            <option value="Female" {% if employee[3] == 'Female' %}selected{% endif %}>Female</option>
                            <option value="Other"  {% if employee[3] == 'Other'  %}selected{% endif %}>Other</option>
                        </select>
                    </div>

                    <!-- Date of Birth -->
                    <div>
                        <label for="dob" class="block text-sm font-medium text-gray-700">Date of Birth</label>
                        <input type="date" name="dob" id="dob" value="{{ employee[4] }}"
                               class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
                    </div>

                    <!-- Address -->
                    <div class="md:col-span-2">
                        <label for="address" class="block text-sm font-medium text-gray-700">Address</label>
                        <textarea name="address" id="address" rows="3"
                                  class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">{{ employee[5] }}</textarea>
                    </div>

                    <!-- Phone Number -->
                    <div>
                        <label for="phone_no" class="block text-sm font-medium text-gray-700">Phone Number</label>
                        <input type="tel" name="phone_no" id="phone_no" value="{{ employee[6] }}"
                               class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
                    </div>

                    <!-- Email / Login ID -->
                    <div>
                        <div class="flex justify-between items-center">
                            <label for="email" class="block text-sm font-medium text-gray-700">Login ID</label>
                            <button type="button" onclick="generateEditEmpLoginId()" class="text-xs font-semibold text-teal-600 hover:text-teal-800 focus:outline-none">
                                <i class="fas fa-magic mr-1"></i>Auto-Generate
                            </button>
                        </div>
                        <input type="text" name="email" id="email" value="{{ employee[7] }}"
                               class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm font-mono uppercase tracking-wide">
                    </div>

                    <!-- Old Password -->
                    <div>
                        <label for="old_password" class="block text-sm font-medium text-gray-700">Old Password</label>
                        <input type="text" id="old_password" readonly value="{{ employee[11] }}"
                               class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 bg-gray-100 text-gray-500 cursor-not-allowed focus:outline-none sm:text-sm">
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700">
                            Password <span class="italic text-xs text-gray-500">(leave blank to keep unchanged)</span>
                        </label>
                        <input type="password" name="password" id="password"
                               class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
                    </div>

                    <!-- Status -->
                    <div>
                        <label for="status" class="block text-sm font-medium text-gray-700">Status</label>
                        <select name="status" id="status"
                                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
                            {% for status in employee_statuses %}
                                <option value="{{ status[1] }}" {% if employee[8] == status[1] %}selected{% endif %}>{{ status[1] }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Employee Type -->
                    <div>
                        <label for="emp_type" class="block text-sm font-medium text-gray-700">Employee Type</label>
                        <select name="emp_type" id="emp_type"
                                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
                            <option value="emp"   {% if employee[9] == 'emp'   %}selected{% endif %}>Employee</option>
                            <option value="admin" {% if employee[9] == 'admin' %}selected{% endif %}>Admin</option>
                        </select>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex justify-end space-x-3 pt-6 border-t border-gray-200">
                    <a href="{{ url_for('employees.view_employees') }}"
                       class="bg-red-600 py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition duration-200">
                        Cancel
                    </a>
                    <button type="submit"
                            class="bg-green-600 border border-transparent rounded-md shadow-sm py-2 px-4 inline-flex justify-center text-sm font-medium text-white hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition duration-200">
                        <i class="fas fa-save mr-2"></i>
                        Save
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function generateEditEmpLoginId() {
        const fn = (document.getElementById('first_name').value || '').trim();
        const ln = (document.getElementById('last_name').value || '').trim();
        const phone = (document.getElementById('phone_no').value || '').trim();

        const combinedName = (fn + ln).replace(/[^a-zA-Z]/g, '').toUpperCase();
        let namePart = combinedName.substring(0, 4);
        if (!namePart) namePart = 'EMP';

        const digits = phone.replace(/\D/g, '');
        const phonePart = digits.length >= 4 ? digits.substring(0, 4) : digits;

        const genId = namePart + phonePart;
        if (genId) {
            document.getElementById('email').value = genId;
        }
    }
</script>
{% endblock %}
